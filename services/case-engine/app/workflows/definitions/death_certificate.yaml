id: death_certificate
description: Register a death and obtain the official death certificate.
adapter_type: death_certificate
applicability_rules:
  - field: deceased.is_deceased
    equals: true
  - field: location.state
    equals: Karnataka
tasks:
  - id: death_registration
    name: Register Death and Obtain Certificate
    estimated_duration_days: 7
inter_workflow_dependencies: []
