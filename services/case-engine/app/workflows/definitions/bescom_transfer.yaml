id: bescom_transfer
description: Transfer a Bengaluru electricity connection to an heir.
adapter_type: bescom
applicability_rules:
  - field: assets.bescom
    equals: true
  - field: deceased.was_electricity_account_holder
    equals: true
tasks:
  - id: bescom_name_transfer
    name: Transfer BESCOM Account Holder
    estimated_duration_days: 15
inter_workflow_dependencies:
  - death_certificate
