[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "citizen-bridge-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "aiokafka>=0.12,<1",
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.116,<1",
    "grpcio>=1.74,<2",
    "openai>=1.99,<2",
    "opentelemetry-api>=1.36,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.36,<2",
    "opentelemetry-instrumentation-fastapi>=0.57b0,<1",
    "opentelemetry-instrumentation-grpc>=0.57b0,<1",
    "opentelemetry-sdk>=1.36,<2",
    "prometheus-client>=0.22,<1",
    "protobuf>=5.29,<7",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = ["aiosqlite>=0.21,<1", "httpx>=0.28,<1", "pytest>=8.4,<9", "pytest-asyncio>=1.1,<2", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.prompts" = ["*.md"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
