known_stages: &known_stages
  - id: submitted
    label: Submitted
    description: Application received by the authority.
    order: 1
  - id: under_review
    label: Under Review
    description: Application is being checked by the responsible office.
    order: 2
  - id: approved
    label: Approved
    description: Application approved and the result is being prepared.
    order: 3
  - id: issued
    label: Issued
    description: Result is ready for collection or download.
    order: 4

services:
  - id: death_certificate
    name: Death Certificate
    authority: BBMP / Municipal Corporation
    category: certificates
    description: Register a death and obtain the official certificate.
    typical_wait_days: [3, 7]
    stages_known: true
    stages: *known_stages
    required_profile_fields: [name, dob, city]
    workflow_id: death_certificate

  - id: family_pension_transfer
    name: Family Pension Transfer
    authority: Karnataka Treasury Department
    category: benefits
    description: Transfer a deceased pensioner's family pension to an eligible survivor.
    typical_wait_days: [15, 30]
    stages_known: false
    stages: []
    required_profile_fields: [name, dob, city, income]
    workflow_id: family_pension

  - id: electricity_name_transfer
    name: Electricity Name Transfer
    authority: BESCOM
    category: utilities
    description: Transfer an electricity connection from a deceased account holder.
    typical_wait_days: [7, 15]
    stages_known: true
    stages: *known_stages
    required_profile_fields: [name, city]
    workflow_id: bescom_transfer

  - id: ration_card_update
    name: Ration Card Household Update
    authority: Karnataka Food and Civil Supplies Department
    category: benefits
    description: Remove a deceased member and nominate a new household head.
    typical_wait_days: [15, 30]
    stages_known: false
    stages: []
    required_profile_fields: [name, city]
    workflow_id: ration_card

  - id: legal_heir_certificate
    name: Legal Heir Certificate
    authority: Karnataka Revenue Department
