[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "citizen-bridge-catalog"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116,<1",
    "grpcio>=1.74,<2",
    "opentelemetry-api>=1.36,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.36,<2",
    "opentelemetry-instrumentation-fastapi>=0.57b0,<1",
    "opentelemetry-instrumentation-grpc>=0.57b0,<1",
    "opentelemetry-sdk>=1.36,<2",
    "prometheus-client>=0.22,<1",
    "protobuf>=5.29,<7",
    "pydantic-settings>=2.10,<3",
    "pyyaml>=6,<7",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
    "types-pyyaml>=6,<7",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.data" = ["*.yaml", "workflows/*.yaml"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "skip"
exclude = "contracts/generated"
