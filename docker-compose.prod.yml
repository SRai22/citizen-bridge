name: citizen-bridge

x-service-environment: &service-environment
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
  DOCUMENT_ENCRYPTION_KEY: ${DOCUMENT_ENCRYPTION_KEY:?DOCUMENT_ENCRYPTION_KEY is required}
  OTEL_ENABLED: "false"

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks: [citizen-bridge-net]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-service-depends-on: &service-depends-on
  postgres:
    condition: service_healthy
  kafka:
    condition: service_healthy
  kafka-init:
    condition: service_completed_successfully

services:
  postgres:
    <<: *service-defaults
    image: postgres:16.15-alpine3.24
    environment:
      POSTGRES_DB: citizen_bridge
      POSTGRES_USER: citizen_bridge_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD is required}
      AUTHORITY_DB_PASSWORD: ${AUTHORITY_DB_PASSWORD:?AUTHORITY_DB_PASSWORD is required}
      CASE_DB_PASSWORD: ${CASE_DB_PASSWORD:?CASE_DB_PASSWORD is required}
      DOCUMENT_DB_PASSWORD: ${DOCUMENT_DB_PASSWORD:?DOCUMENT_DB_PASSWORD is required}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?NOTIFICATION_DB_PASSWORD is required}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?CATALOG_DB_PASSWORD is required}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:?AI_DB_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-schemas.sh:/docker-entrypoint-initdb.d/10-init-schemas.sh:ro
      - ./infrastructure/postgres/schemas.sql:/opt/citizen-bridge/schemas.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U citizen_bridge_admin -d citizen_bridge"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 2G

  kafka:
    <<: *service-defaults
    image: apache/kafka:4.3.1
    hostname: kafka
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      KAFKA_HEAP_OPTS: -Xms512m -Xmx1024m
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 2G

  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPICS_BIN: /opt/kafka/bin/kafka-topics.sh
    volumes:
      - ./infrastructure/kafka/topics.sh:/init/topics.sh:ro
    entrypoint: [/bin/sh, /init/topics.sh]
    restart: "no"
    networks: [citizen-bridge-net]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    <<: *service-defaults
    image: nginx:1.28.3-alpine3.23
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:80:80"
    expose: ["8080"]
    healthcheck:
      test: [CMD, wget, -qO-, http://localhost/health]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  frontend:
    <<: *service-defaults
    build:
      context: ./frontend
      target: runner
    image: citizen-bridge-frontend:prod
    environment:
      API_URL: http://nginx:8080
      NODE_ENV: production
    expose: ["3000"]
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:3000/api/health]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

  auth:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    image: citizen-bridge-auth:prod
    depends_on: *service-depends-on
    environment:
      <<: *service-environment
      SERVICE_NAME: auth
      HTTP_PORT: 8001
      GRPC_PORT: 50051
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-7}
      OTP_DEMO_CODE: ${OTP_DEMO_CODE:-}
      DATABASE_URL: postgresql+asyncpg://auth_service:${AUTH_DB_PASSWORD}@postgres:5432/citizen_bridge
    expose: ["8001", "50051"]
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M

  authority:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/authority/Dockerfile
    image: citizen-bridge-authority:prod
    depends_on:
      <<: *service-depends-on
      auth:
        condition: service_healthy
    environment:
      <<: *service-environment
      SERVICE_NAME: authority
      HTTP_PORT: 8002
      GRPC_PORT: 50052
      AUTH_GRPC_HOST: auth:50051
      EXPIRATION_CHECK_SECONDS: ${EXPIRATION_CHECK_SECONDS:-60}
      DATABASE_URL: postgresql+asyncpg://authority_service:${AUTHORITY_DB_PASSWORD}@postgres:5432/citizen_bridge
    expose: ["8002", "50052"]
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M

  case-engine:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/case-engine/Dockerfile
    image: citizen-bridge-case-engine:prod
    depends_on:
      <<: *service-depends-on
      auth:
        condition: service_healthy
      authority:
        condition: service_healthy
      catalog:
        condition: service_healthy
      documents:
        condition: service_healthy
      ai:
        condition: service_healthy
    environment:
      <<: *service-environment
      SERVICE_NAME: case-engine
      HTTP_PORT: 8003
      GRPC_PORT: 50053
      AUTH_GRPC_HOST: auth:50051
      AUTHORITY_GRPC_HOST: authority:50052
      CATALOG_GRPC_HOST: catalog:50056
      DOCUMENTS_GRPC_HOST: documents:50054
      AI_GRPC_HOST: ai:50057
      DEMO_MODE: ${DEMO_MODE:-true}
      DATABASE_URL: postgresql+asyncpg://case_service:${CASE_DB_PASSWORD}@postgres:5432/citizen_bridge
    expose: ["8003", "50053"]
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

  documents:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/documents/Dockerfile
    image: citizen-bridge-documents:prod
    depends_on:
      <<: *service-depends-on
      auth:
        condition: service_healthy
    environment:
      <<: *service-environment
      SERVICE_NAME: documents
      HTTP_PORT: 8004
      GRPC_PORT: 50054
      AUTH_GRPC_HOST: auth:50051
      DATABASE_URL: postgresql+asyncpg://document_service:${DOCUMENT_DB_PASSWORD}@postgres:5432/citizen_bridge
    expose: ["8004", "50054"]
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M

  notifications:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/notifications/Dockerfile
    image: citizen-bridge-notifications:prod
    depends_on:
      <<: *service-depends-on
      auth:
        condition: service_healthy
      authority:
        condition: service_healthy
    environment:
      <<: *service-environment
      SERVICE_NAME: notifications
      HTTP_PORT: 8005
      GRPC_PORT: 50055
      AUTH_GRPC_HOST: auth:50051
      AUTHORITY_GRPC_HOST: authority:50052
      DATABASE_URL: postgresql+asyncpg://notification_service:${NOTIFICATION_DB_PASSWORD}@postgres:5432/citizen_bridge
    expose: ["8005", "50055"]
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M

  catalog:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/catalog/Dockerfile
    image: citizen-bridge-catalog:prod
    environment:
      SERVICE_NAME: catalog
      HTTP_PORT: 8006
      GRPC_PORT: 50056
      OTEL_ENABLED: "false"
    expose: ["8006", "50056"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8006/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  ai:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/ai/Dockerfile
    image: citizen-bridge-ai:prod
    depends_on:
      <<: *service-depends-on
      auth:
        condition: service_healthy
    environment:
      <<: *service-environment
      SERVICE_NAME: ai
      HTTP_PORT: 8007
      GRPC_PORT: 50057
      AUTH_GRPC_HOST: auth:50051
      DATABASE_URL: postgresql+asyncpg://ai_service:${AI_DB_PASSWORD}@postgres:5432/citizen_bridge
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required when AI_MOCK_MODE is false}
      AI_MOCK_MODE: "false"
      INTAKE_MODEL: ${AI_INTAKE_MODEL:-gpt-4o-mini}
      REJECTION_MODEL: ${AI_REJECTION_MODEL:-gpt-4o}
    expose: ["8007", "50057"]
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

  jaeger:
    <<: *service-defaults
    profiles: [observability]
    image: jaegertracing/all-in-one:1.76.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

networks:
  citizen-bridge-net:
    name: citizen-bridge-net

volumes:
  pgdata:
  kafkadata:
