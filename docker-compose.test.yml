name: citizen-bridge-test

x-test-passwords: &test-passwords
  POSTGRES_PASSWORD: test-postgres-password
  AUTH_DB_PASSWORD: test-auth-password
  AUTHORITY_DB_PASSWORD: test-authority-password
  CASE_DB_PASSWORD: test-case-password
  DOCUMENT_DB_PASSWORD: test-document-password
  NOTIFICATION_DB_PASSWORD: test-notification-password
  CATALOG_DB_PASSWORD: test-catalog-password
  AI_DB_PASSWORD: test-ai-password

services:
  postgres:
    image: postgres:16.15-alpine3.24
    environment:
      <<: *test-passwords
      POSTGRES_DB: citizen_bridge
      POSTGRES_USER: citizen_bridge_admin
    tmpfs: [/var/lib/postgresql/data]
    volumes:
      - ./infrastructure/postgres/init-schemas.sh:/docker-entrypoint-initdb.d/10-init-schemas.sh:ro
      - ./infrastructure/postgres/schemas.sql:/opt/citizen-bridge/schemas.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U citizen_bridge_admin -d citizen_bridge"]
      interval: 2s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.3.1
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    tmpfs: [/var/lib/kafka/data]
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPICS_BIN: /opt/kafka/bin/kafka-topics.sh
    volumes:
      - ./infrastructure/kafka/topics.sh:/init/topics.sh:ro
    entrypoint: [/bin/sh, /init/topics.sh]
    restart: "no"

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    environment:
      SERVICE_NAME: auth
      HTTP_PORT: 8001
      GRPC_PORT: 50051
      DATABASE_URL: postgresql+asyncpg://auth_service:test-auth-password@postgres:5432/citizen_bridge
      JWT_SECRET: test-only-jwt-secret-with-at-least-32-characters
      INTERNAL_SERVICE_TOKEN: test-only-internal-service-token
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OTEL_ENABLED: "false"
    ports: ["18001:8001"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  authority:
    build:
      context: .
      dockerfile: services/authority/Dockerfile
    environment:
      SERVICE_NAME: authority
      HTTP_PORT: 8002
      GRPC_PORT: 50052
      DATABASE_URL: postgresql+asyncpg://authority_service:test-authority-password@postgres:5432/citizen_bridge
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AUTH_GRPC_HOST: auth:50051
      EXPIRATION_CHECK_SECONDS: 1
      OTEL_ENABLED: "false"
    ports: ["18002:8002"]
    depends_on:
      auth:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  case-engine:
    build:
      context: .
      dockerfile: services/case-engine/Dockerfile
    environment:
      SERVICE_NAME: case-engine
      HTTP_PORT: 8003
      GRPC_PORT: 50053
      DATABASE_URL: postgresql+asyncpg://case_service:test-case-password@postgres:5432/citizen_bridge
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AUTH_GRPC_HOST: auth:50051
      AUTHORITY_GRPC_HOST: authority:50052
      CATALOG_GRPC_HOST: catalog:50056
      AI_GRPC_HOST: ai:50057
      OTEL_ENABLED: "false"
    ports: ["18003:8003"]
    depends_on:
      authority:
        condition: service_healthy
      catalog:
        condition: service_healthy
      ai:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  documents:
    build:
      context: .
      dockerfile: services/documents/Dockerfile
    environment:
      SERVICE_NAME: documents
      HTTP_PORT: 8004
      GRPC_PORT: 50054
      DATABASE_URL: postgresql+asyncpg://document_service:test-document-password@postgres:5432/citizen_bridge
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AUTH_GRPC_HOST: auth:50051
      EXPIRATION_CHECK_SECONDS: 1
      OTEL_ENABLED: "false"
    ports: ["18004:8004"]
    depends_on:
      auth:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  notifications:
    build:
      context: .
      dockerfile: services/notifications/Dockerfile
    environment:
      SERVICE_NAME: notifications
      HTTP_PORT: 8005
      GRPC_PORT: 50055
      DATABASE_URL: postgresql+asyncpg://notification_service:test-notification-password@postgres:5432/citizen_bridge
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AUTH_GRPC_HOST: auth:50051
      AUTHORITY_GRPC_HOST: authority:50052
      OTEL_ENABLED: "false"
    ports: ["18005:8005"]
    depends_on:
      auth:
        condition: service_healthy
      authority:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  catalog:
    build:
      context: .
      dockerfile: services/catalog/Dockerfile
    environment:
      SERVICE_NAME: catalog
      HTTP_PORT: 8006
      GRPC_PORT: 50056
      DATABASE_URL: postgresql+asyncpg://catalog_service:test-catalog-password@postgres:5432/citizen_bridge
      OTEL_ENABLED: "false"
    ports: ["18006:8006"]
    depends_on:
      postgres:
        condition: service_healthy

  ai:
    build:
      context: .
      dockerfile: services/ai/Dockerfile
    environment:
      SERVICE_NAME: ai
      HTTP_PORT: 8007
      GRPC_PORT: 50057
      DATABASE_URL: postgresql+asyncpg://ai_service:test-ai-password@postgres:5432/citizen_bridge
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AUTH_GRPC_HOST: auth:50051
      AI_MOCK_MODE: "true"
      OTEL_ENABLED: "false"
    ports: ["18007:8007"]
    depends_on:
      auth:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  legacy-backend:
    build:
      context: ./backend
      target: runner
    environment:
      DATABASE_URL: sqlite:///./data/citizen_bridge.db
      DEMO_MODE: "true"
      MOCK_AI: "true"
    volumes:
      - legacy_test_data:/app/data
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      timeout: 3s
      retries: 20

  nginx:
    image: nginx:1.28.3-alpine3.23
    depends_on:
      auth:
        condition: service_healthy
      authority:
        condition: service_healthy
      case-engine:
        condition: service_healthy
      documents:
        condition: service_healthy
      notifications:
        condition: service_healthy
      catalog:
        condition: service_healthy
      ai:
        condition: service_healthy
      legacy-backend:
        condition: service_healthy
    environment:
      FRONTEND_ORIGIN: http://localhost:13000
      NGINX_ENVSUBST_FILTER: ^FRONTEND_ORIGIN$
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro
    ports: ["18080:80"]
    healthcheck:
      test: [CMD, wget, -qO-, http://localhost/health]
      interval: 2s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: ./frontend
      target: runner
    depends_on:
      nginx:
        condition: service_healthy
    environment:
      API_URL: http://nginx
    ports: ["13000:3000"]
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:3000/api/health]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  legacy_test_data:
