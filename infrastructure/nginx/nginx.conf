map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $http_x_correlation_id $correlation_id {
    default $http_x_correlation_id;
    '' $request_id;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
}

map $http_x_forwarded_proto $redirect_https {
    default 0;
    http 1;
}

# Public single origin. Next.js owns /api routes because its BFF stores and
# refreshes authentication tokens in HTTP-only cookies.
server {
    listen 80;
    listen [::]:80;
    server_tokens off;

    if ($host = www.citizenbridge.net) {
        return 308 https://citizenbridge.net$request_uri;
    }

    if ($redirect_https) {
        return 308 https://$host$request_uri;
    }

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /health {
        access_log off;
        return 200 'gateway healthy\n';
        add_header Content-Type text/plain;
    }

    location /ws {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream http://notifications:8005;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60m;
    }

    location / {
        client_max_body_size 11m;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream http://frontend:3000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_intercept_errors on;
        error_page 502 504 =503 @public_service_unavailable;
    }

    location @public_service_unavailable {
        default_type application/json;
        return 503 '{"detail":"service unavailable"}';
    }
}

# Docker-network-only gateway used by the Next.js BFF. This listener is never
# published by Compose, keeping tokens and backend services off the public edge.
server {
    listen 8080;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Correlation-ID $correlation_id;
    proxy_intercept_errors on;
    error_page 502 504 =503 @internal_service_unavailable;

    location = /health {
        access_log off;
        return 200 'gateway healthy\n';
        add_header Content-Type text/plain;
    }

    location /api/auth {
        set $upstream http://auth:8001;
        proxy_pass $upstream;
    }

    location /api/authority {
        set $upstream http://authority:8002;
        proxy_pass $upstream;
    }

    location /api/cases {
        set $upstream http://case-engine:8003;
        proxy_pass $upstream;
    }

    location /api/approvals {
        set $upstream http://case-engine:8003;
        proxy_pass $upstream;
    }

    location /api/docs {
        client_max_body_size 11m;
        set $upstream http://documents:8004;
        proxy_pass $upstream;
    }

    location /api/notifications {
        set $upstream http://notifications:8005;
        proxy_pass $upstream;
    }

    location /api/catalog {
        set $upstream http://catalog:8006;
        proxy_pass $upstream;
    }

    location /api/ai {
        set $upstream http://ai:8007;
        proxy_pass $upstream;
    }

    location = /api/legacy/health {
        set $upstream http://legacy-backend:8000;
        rewrite ^ /health break;
        proxy_pass $upstream;
    }

    location /api/legacy/ {
        set $upstream http://legacy-backend:8000;
        rewrite ^/api/legacy/(.*)$ /api/$1 break;
        proxy_pass $upstream;
    }

    location @internal_service_unavailable {
        default_type application/json;
        return 503 '{"detail":"service unavailable"}';
    }
}
