map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $http_x_correlation_id $correlation_id {
    default $http_x_correlation_id;
    '' $request_id;
}

server {
    listen 80;
    listen [::]:80;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;

    add_header Access-Control-Allow-Origin '${FRONTEND_ORIGIN}' always;
    add_header Access-Control-Allow-Credentials 'true' always;
    add_header Access-Control-Allow-Headers 'Authorization,Content-Type,X-Correlation-ID' always;
    add_header Access-Control-Allow-Methods 'GET,POST,PUT,PATCH,DELETE,OPTIONS' always;
    add_header Vary 'Origin' always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-ID $correlation_id;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_intercept_errors on;
    error_page 502 504 =503 @service_unavailable;

    if ($request_method = OPTIONS) {
        return 204;
    }

    location = /health {
        access_log off;
        return 200 'gateway healthy\n';
        add_header Content-Type text/plain;
    }

    location /api/auth {
        set $upstream http://auth:8001;
        proxy_pass $upstream;
    }

    location /api/authority {
        set $upstream http://authority:8002;
        proxy_pass $upstream;
    }

    location /api/cases {
        set $upstream http://case-engine:8003;
        proxy_pass $upstream;
    }

    location /api/approvals {
        set $upstream http://case-engine:8003;
        proxy_pass $upstream;
    }

    location /api/docs {
        set $upstream http://documents:8004;
        proxy_pass $upstream;
    }

    location /api/notifications {
        set $upstream http://notifications:8005;
        proxy_pass $upstream;
    }

    location /api/catalog {
        set $upstream http://catalog:8006;
        proxy_pass $upstream;
    }

    location /api/ai {
        set $upstream http://ai:8007;
        proxy_pass $upstream;
    }

    location /ws/ {
        set $upstream http://notifications:8005;
        proxy_pass $upstream;
        proxy_read_timeout 60m;
    }

    location /api/legacy/ {
        proxy_pass http://legacy-backend:8000/api/;
    }

    location @service_unavailable {
        default_type application/json;
        return 503 '{"detail":"service unavailable"}';
    }
}
