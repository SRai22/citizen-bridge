syntax = "proto3";

package citizen_bridge.authority.v1;

service AuthorityService {
  rpc CheckAccess(CheckAccessRequest) returns (CheckAccessResponse);
  rpc GetUserCases(GetUserCasesRequest) returns (CaseAccessList);
  rpc GetCaseUsers(GetCaseUsersRequest) returns (CaseUserList);
  rpc GrantAccess(GrantAccessRequest) returns (GrantResponse);
  rpc RevokeAccess(RevokeAccessRequest) returns (RevokeResponse);
  rpc RegisterCaseOwner(RegisterCaseOwnerRequest) returns (GrantResponse);
  rpc RegisterCaseCoordinator(RegisterCaseCoordinatorRequest) returns (GrantResponse);
}

message CheckAccessRequest {
  string user_id = 1;
  string resource_type = 2;
  string resource_id = 3;
  string action = 4;
}

message CheckAccessResponse {
  bool allowed = 1;
  string role = 2;
  repeated string permissions = 3;
  repeated string limitations = 4;
}

message GetUserCasesRequest { string user_id = 1; }

message CaseAccess {
  string case_id = 1;
  string role = 2;
  repeated string permissions = 3;
}

message CaseAccessList { repeated CaseAccess cases = 1; }

message GetCaseUsersRequest { string case_id = 1; }

message CaseUserList { repeated string user_ids = 1; }

message GrantAccessRequest {
  string actor_user_id = 1;
  string grantee_id = 2;
  string resource_type = 3;
  string resource_id = 4;
  string role = 5;
  string expires_at = 6;
}

message GrantResponse {
  string grant_id = 1;
  string grantee_id = 2;
  string resource_type = 3;
  string resource_id = 4;
  string role = 5;
  repeated string permissions = 6;
}

message RevokeAccessRequest {
  string actor_user_id = 1;
  string grant_id = 2;
  string reason = 3;
}

message RevokeResponse { bool revoked = 1; }

message RegisterCaseOwnerRequest {
  string user_id = 1;
  string case_id = 2;
}

message RegisterCaseCoordinatorRequest {
  string user_id = 1;
  string case_id = 2;
  string subject_person_id = 3;
  string relationship = 4;
}
