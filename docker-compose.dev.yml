services:
  postgres:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  kafka:
    ports:
      - "${KAFKA_PORT:-29092}:29092"

  legacy-backend:
    build:
      target: development
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
    ports:
      - "${LEGACY_BACKEND_PORT:-8000}:8000"
    restart: "no"
    volumes:
      - ./backend:/app
      - citizen_bridge_data:/app/data

  frontend:
    build:
      target: development
    command: npm run dev -- --hostname 0.0.0.0
    restart: "no"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next

  auth:
    command: sh -c "alembic upgrade head && uvicorn app.main:app --reload --host 0.0.0.0 --port 8001"
    ports: ["8001:8001", "50051:50051"]
    volumes:
      - ./services/auth/app:/app/services/auth/app
      - ./services/auth/alembic:/app/services/auth/alembic
      - ./contracts:/app/contracts

  authority:
    command: sh -c "alembic upgrade head && uvicorn app.main:app --reload --host 0.0.0.0 --port 8002"
    ports: ["8002:8002", "50052:50052"]
    volumes:
      - ./services/authority/app:/app/services/authority/app
      - ./services/authority/alembic:/app/services/authority/alembic
      - ./contracts:/app/contracts

  case-engine:
    command: sh -c "alembic upgrade head && uvicorn app.main:app --reload --host 0.0.0.0 --port 8003"
    ports: ["8003:8003", "50053:50053"]
    volumes:
      - ./services/case-engine/app:/app/services/case-engine/app
      - ./services/case-engine/alembic:/app/services/case-engine/alembic
      - ./contracts:/app/contracts

  documents:
    command: sh -c "alembic upgrade head && uvicorn app.main:app --reload --host 0.0.0.0 --port 8004"
    ports: ["8004:8004", "50054:50054"]
    volumes:
      - ./services/documents/app:/app/services/documents/app
      - ./services/documents/alembic:/app/services/documents/alembic
      - ./contracts:/app/contracts

  notifications:
    command: sh -c "alembic upgrade head && uvicorn app.main:app --reload --host 0.0.0.0 --port 8005"
    ports: ["8005:8005", "50055:50055"]
    volumes:
      - ./services/notifications/app:/app/services/notifications/app
      - ./services/notifications/alembic:/app/services/notifications/alembic
      - ./contracts:/app/contracts

  catalog:
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8006
    ports: ["8006:8006", "50056:50056"]
    volumes:
      - ./services/catalog/app:/app/services/catalog/app
      - ./contracts:/app/contracts

  ai:
    command: sh -c "alembic upgrade head && uvicorn app.main:app --reload --host 0.0.0.0 --port 8007"
    ports: ["8007:8007", "50057:50057"]
    volumes:
      - ./services/ai/app:/app/services/ai/app
      - ./services/ai/alembic:/app/services/ai/alembic
      - ./contracts:/app/contracts

volumes:
  frontend_node_modules:
  frontend_next_cache:
